<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Locked | No Preview Available</title>
    <style>
        /* Reset and Box Sizing */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Body with Green, Blue, and Light Accents */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Vibrant deep green to rich blue gradient background */
            background: linear-gradient(135deg, #064e3b 0%, #0284c7 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Decorative Background Elements (Blue & Green glow effects) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.25); /* Blue glow */
            border-radius: 50%;
            top: -50px;
            right: -50px;
            filter: blur(80px);
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.3); /* Green glow */
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
            filter: blur(80px);
        }

        /* Main Card Container (Pure White) */
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
        }

        /* Lock Icon Container */
        .icon-wrapper {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, #e0f2fe 0%, #dcfce7 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .icon-wrapper svg {
            width: 38px;
            height: 38px;
            stroke: #0284c7; /* Vibrant Blue */
        }

        /* Status Badge (Blue accent) */
        .status-tag {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        /* Typography */
        h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
            color: #0f172a; /* Dark text for clean contrast */
        }

        p {
            color: #475569;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Notice Box (Green accent border and light fill) */
        .notice-box {
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            color: #166534; /* Rich green text */
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: #10b981; /* Bright green pulsing dot */
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
            animation: pulse 1.8s infinite;
        }

        /* Animation */
        @keyframes pulse {
            0% {
                transform: scale(0.95);
                opacity: 1;
            }
            50% {
                transform: scale(1.25);
                opacity: 0.5;
            }
            100% {
                transform: scale(0.95);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Lock Icon SVG -->
        <div class="icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>

        <span class="status-tag">Access Locked</span>

        <h1>No Preview Available</h1>
        
        <p>This page is currently restricted and cannot be previewed right now.</p>

        <div class="notice-box">
            <span class="dot"></span>
            <span>It will be back soon!</span>
        </div>
    </div>

</body>
</html>
